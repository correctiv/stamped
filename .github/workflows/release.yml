name: Release

# A tag is a release: `git tag v0.1.0 && git push --tags` ships Stamped as deb, rpm and AppImage
# (Linux), macos-app-zip (arm64, x64) and windows-dir-zip + msi, all attached to one GitHub
# release. Assembly is not host-bound (gjsify ADR 0024 § A1), so one Linux job builds every
# platform; the Mach-O and PE payloads are only RUN on their own OS. macOS and Windows output is
# unsigned; signing and notarisation attach here once a Developer ID exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:44
    permissions:
      contents: write
    steps:
      - name: Install prerequisites
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar xz findutils gh
          gjs libsoup3 json-glib gnutls libnghttp2
          libgda libgda-sqlite
          gettext glib2 msitools zip unzip file
          squashfs-tools

      # No distribution packages appimagetool, so pin the release by its checksum.
      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod +x /usr/local/bin/appimagetool

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache gjsify tarball store
        uses: actions/cache@v4
        with:
          path: ~/.cache/gjsify/tarballs
          key: gjsify-tarballs-${{ hashFiles('gjsify-lock.json') }}
          restore-keys: gjsify-tarballs-

      - name: Bootstrap the gjsify CLI
        run: |
          VERSION=$(node -p "require('./app/package.json').devDependencies['@gjsify/cli']")
          npm install -g "@gjsify/cli@$VERSION"

      - name: Install dependencies
        # From here on the PINNED CLI, not the bootstrap one: `npm install -g` resolves the
        # CLI's own `^` deps to the newest release, so the global copy builds with a newer
        # rolldown-plugin-gjsify than the lockfile's libs (0.64.4 injected
        # `@gjsify/web-globals/register/self`, which 0.64.2 does not export).
        run: |
          gjsify install --immutable
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # Both bundles up front: Linux ships the GJS one, macOS and Windows the Node one. The build
      # also compiles the catalogues that `gjsify.ship.localeDir` points at.
      - name: Build the bundles
        run: cd app && gjsify run build:gjs && gjsify run build:node

      # The embedding model, ~296 MiB. Cached by the sha256 of the pinned file, so a cache hit
      # can only ever be the file the pin names.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: app/models/embeddinggemma-2-Q8_0.gguf
          key: embeddinggemma-2-q8_0-2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135

      # Fetches the pinned revision and verifies the sha256; skips the download when the file is
      # already there. The model is never committed — it is 296 MiB of somebody else's work.
      - name: Fetch the embedding model
        run: node --experimental-strip-types app/scripts/fetch-model.mts fetch

      # AppImage is back: it needs `kind: "app"`, which Stamped only became when it grew a window.
      #
      # The packages do NOT carry the model: 296 MiB inside a .deb or .rpm is a distribution
      # decision, not ours. The AppImage and the macOS .app do carry it — those are the artifacts
      # a person downloads and runs, and semantic search must work offline from the first start.
      - name: Ship Linux (packages)
        run: cd app && gjsify ship linux --skip-build --target deb,rpm

      - name: Ship Linux (AppImage, with the embedding model)
        run: |
          node --experimental-strip-types app/scripts/fetch-model.mts ship-config --on
          cd app && gjsify ship linux --skip-build --target appimage

      # Naming the target installs the os/cpu-gated runtime packages a plain install skips.
      - name: Ship macOS (arm64)
        run: |
          gjsify install --os darwin --cpu arm64 --immutable
          cd app && gjsify ship darwin --arch arm64 --skip-build --target macos-app-zip

      - name: Ship macOS (x64)
        run: |
          gjsify install --os darwin --cpu x64 --immutable
          cd app && gjsify ship darwin --arch x64 --skip-build --target macos-app-zip

      # The Windows artifacts carry no model: the ship config goes off before them, so the 296 MiB
      # stay out of the .zip and the .msi.
      - name: Ship Windows (x64)
        run: |
          node --experimental-strip-types app/scripts/fetch-model.mts ship-config --off
          gjsify install --os win32 --cpu x64 --immutable
          cd app && gjsify ship windows --arch x64 --skip-build --target windows-dir-zip,msi

      # `ship` exits 0 after writing nothing when every target is filtered away: assert by name.
      - name: Assert the artifacts arrived
        working-directory: app/ship/out
        run: |
          set -eu
          ls -la
          version=$(node -p "require('$GITHUB_WORKSPACE/app/package.json').version")
          for f in \
            "stamped_${version}-1_amd64.deb" \
            "stamped-${version}-1.x86_64.rpm" \
            "stamped-${version}-1.x86_64.AppImage" \
            "stamped-${version}-1.macos.arm64.zip" \
            "stamped-${version}-1.macos.x86_64.zip" \
            "stamped-${version}-1.windows.x64.zip" \
            "stamped-${version}-1.x64.msi"; do
            [ -s "$f" ] || { echo "::error::missing or empty artifact: $f"; exit 1; }
          done

      # The model is 296 MiB and nobody reads a file list, so the artifacts are opened and
      # asked what is inside: the AppImage and the macOS .app carry it, the Windows .zip must not.
      # The listings are captured instead of piped: `grep -q` exits on the first match, and
      # GitHub's bash runs with `pipefail`, so a pipe into it would fail the step on SIGPIPE.
      - name: Assert the embedding model ships where it should
        run: |
          set -eu
          appimage=$(ls app/ship/out/*.AppImage)
          chmod +x "$appimage"
          offset=$("$appimage" --appimage-offset)
          listing=$(unsquashfs -o "$offset" -l "$appimage")
          case "$listing" in
            *usr/share/models/embeddinggemma-2-Q8_0.gguf*) ;;
            *) echo "::error::the AppImage does not carry the model"; exit 1 ;;
          esac
          for macos in app/ship/out/*macos*.zip; do
            names=$(unzip -Z1 "$macos")
            case "$names" in
              *share/models/embeddinggemma-2-Q8_0.gguf*) ;;
              *) echo "::error::$macos does not carry the model"; exit 1 ;;
            esac
          done
          names=$(unzip -Z1 app/ship/out/*windows*.zip)
          case "$names" in
            *embeddinggemma-2-Q8_0.gguf*) echo "::error::the Windows artifact carries the model"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: app/ship/out/*
          compression-level: 0

      # Only for a tag; a manual run exercises the chain without publishing.
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" app/ship/out/* --title "$GITHUB_REF_NAME" --generate-notes
